<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 220" role="img" aria-label="Customer asks a question, the model picks a tool, the tool checks ownership, code writes the reply, the customer reads the answer">
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#9198a1"/></marker></defs>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" fill="#f0f6fc">
<text x="35" y="40" font-size="20" font-weight="700">How the shopping assistant answers</text>
<rect x="35" y="72" width="130" height="70" rx="6" fill="#151b23" stroke="#3d444d"/>
<text x="100" y="103" font-size="15" font-weight="600" text-anchor="middle">Customer</text>
<text x="100" y="124" font-size="12.5" text-anchor="middle" fill="#9198a1">asks a question</text>
<line x1="169" y1="107" x2="191" y2="107" stroke="#9198a1" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="195" y="72" width="130" height="70" rx="6" fill="#151b23" stroke="#4493f8" stroke-width="2"/>
<text x="260" y="103" font-size="15" font-weight="600" text-anchor="middle">Model</text>
<text x="260" y="124" font-size="12.5" text-anchor="middle" fill="#9198a1">picks a tool</text>
<line x1="329" y1="107" x2="351" y2="107" stroke="#9198a1" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="355" y="72" width="130" height="70" rx="6" fill="#151b23" stroke="#3d444d"/>
<text x="420" y="103" font-size="15" font-weight="600" text-anchor="middle">Tool</text>
<text x="420" y="124" font-size="12.5" text-anchor="middle" fill="#9198a1">checks ownership</text>
<line x1="489" y1="107" x2="511" y2="107" stroke="#9198a1" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="515" y="72" width="130" height="70" rx="6" fill="#151b23" stroke="#4493f8" stroke-width="2"/>
<text x="580" y="103" font-size="15" font-weight="600" text-anchor="middle">Code</text>
<text x="580" y="124" font-size="12.5" text-anchor="middle" fill="#9198a1">writes the reply</text>
<line x1="649" y1="107" x2="671" y2="107" stroke="#9198a1" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="675" y="72" width="130" height="70" rx="6" fill="#151b23" stroke="#3d444d"/>
<text x="740" y="103" font-size="15" font-weight="600" text-anchor="middle">Customer</text>
<text x="740" y="124" font-size="12.5" text-anchor="middle" fill="#9198a1">reads the answer</text>
<text x="260" y="166" font-size="12.5" font-weight="600" text-anchor="middle" fill="#4493f8">never writes customer text</text>
<text x="580" y="166" font-size="12.5" font-weight="600" text-anchor="middle" fill="#4493f8">every sentence is code</text>
<text x="35" y="204" font-size="12.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#9198a1">rate limits · per-store toggles · about $0.003 per chat</text>
</g>
</svg>
